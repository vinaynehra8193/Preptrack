
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11111B">

    <title>Create Account | PrepTrack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background:
                radial-gradient(circle at top right, rgba(139, 92, 246, 0.14), transparent 35%),
                var(--bg-primary);
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-brand a {
            color: var(--text-primary);
            font-size: 30px;
            font-weight: 800;
            text-decoration: none;
        }

        .auth-brand span {
            color: var(--primary);
        }

        .auth-brand p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 8px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 34px;
        }

        .auth-card h1 {
            color: var(--text-primary);
            font-size: 26px;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group select {
            color: var(--text-secondary);
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-button);
            background: var(--primary);
            color: white;
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 5px;
        }

        .auth-button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .auth-switch {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 22px;
        }

        .auth-switch a,
        .back-home {
            color: var(--secondary);
            text-decoration: none;
        }

        .auth-switch a:hover,
        .back-home:hover {
            text-decoration: underline;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
        }

        .back-home {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .form-note {
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.5;
            margin-top: 12px;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px 20px;
            }

            .auth-card h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-wrapper">

        <div class="auth-brand">
            <a href="index.html">PrepTrack<span>.</span></a>
            <p>Your Academics. Your Schedule. Your Success.</p>
        </div>

        <section class="auth-card">

            <h1>Create Your Account ✨</h1>

            <p class="auth-subtitle">
                Join PrepTrack and organize your academic life.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                        minlength="2"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentId">Student ID / Enrollment Number</label>
                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter your student ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" required>
                        <option value="">Select your course</option>
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="BCom">B.Com</option>
                        <option value="BA">B.A.</option>
                        <option value="BSc">B.Sc.</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="semester">Semester</label>
                    <select id="semester" required>
                        <option value="">Select your semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 8 characters"
                        required
                        minlength="8"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                        minlength="8"
                    >
                </div>

                <button type="submit" class="auth-button">
                    Create Account →
                </button>

                <p class="form-note">
                    Registration is for students only. Admin accounts are
                    created separately by the project administrators.
                </p>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>

        </section>

        <div class="auth-footer">
            <a href="index.html" class="back-home">
                ← Back to Homepage
            </a>
        </div>

    </main>
<script src="js/auth.js"></script>
</body>
</html>
